version: "3.1"

intents:
  - apply_dormitory
  - apply_intern
  - forms_info
  - dorm_basic_set
  - furnished_rooms
  - office_hours
  - rental_prices
  - utilities_included
  - goodbye


actions:
  - utter_apply_dormitory
  - utter_apply_intern
  - utter_forms_info
  - utter_dorm_basic_set
  - utter_furnished_rooms
  - utter_office_hours
  - utter_rental_prices
  - utter_utilities_included
  - utter_goodbye 

responses:
  utter_apply_dormitory:
    - text: "To apply for a dormitory, you can use the online application. It's non-binding and doesn't require a matriculation certificate or admission notice."

  utter_apply_intern:
    - text: "If you're completing an internship in Bonn, we offer furnished rooms for interns. The lease starts on the first working day of the month."

  utter_forms_info:
    - text: "You can find important forms and rental price information on the website. Please send the printed forms with an original signature."

  utter_dorm_basic_set:
    - text: "The Dorm Basic Set is for international students arriving with limited luggage. It provides bedding and essential kitchen equipment."

  utter_furnished_rooms:
    - text: "The furnished rooms typically include a bed, wardrobe, desk, chair, and a shelf."

  utter_office_hours:
    - text: "The administration is available on Monday, Tuesday, and Thursday from 9 am to 12 pm, and additionally on Thursday from 2 pm to 4 pm."

  utter_rental_prices:
    - text: "Around 62% of the dormitories have rents below 350 euros. Visit the website for detailed rent price ranges."

  utter_utilities_included:
    - text: "Utilities like electricity, gas, water, waste disposal, and high-speed Internet (1000 Mbit/s) are included in the rent."

  utter_goodbye:
    - text: "Goodbye! If you have more questions, feel free to ask."

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
